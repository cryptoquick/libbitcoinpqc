# Full verification gate. Locally: `just test`. CI runs the same recipes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hermetic flake checks + host CMake dual-path (via nix develop if needed).
  full:
    name: just test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Magic Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v9
        continue-on-error: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Full gate
        run: just test

  # Non-Nix path: apt toolchain + FetchContent (classic packager path).
  cmake:
    name: host cmake (no nix)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Host CMake build + test + smoke
        run: just cmake-test
